name: "08-05 Pogoda API — Environments"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - feature/06-pogoda-api
  pull_request:
    branches:
      - main
      - feature/06-pogoda-api
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  WORKDIR: ${{ vars.WORKDIR }}
  DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
  HUB_IMAGE_BASE: ${{ secrets.DOCKER_LOGIN }}/${{ vars.DOCKER_IMAGE_NAME }}
  TEST_IMAGE: ${{ secrets.DOCKER_LOGIN }}/${{ vars.DOCKER_IMAGE_NAME }}
  CI_TAG: ci-${{ github.sha }}
  WEATHER_CITY: ${{ vars.WEATHER_CITY || 'Warsaw' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.4.1

      - name: Build common CI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v7.4.0
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}:${{ env.CI_TAG }}
          load: true
          push: false

      - name: Save common CI image
        run: docker save "${TEST_IMAGE}:${CI_TAG}" -o image.tar

      - name: Upload common CI image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.2
        with:
          name: pogoda-environments-image
          path: image.tar

  test:
    runs-on: ubuntu-latest
    needs: build
    env:
      OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
    steps:
      - name: Download common CI image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.2
        with:
          name: pogoda-environments-image

      - name: Load common CI image
        run: docker load -i image.tar

      - name: Validate OpenWeather API key
        if: env.OPENWEATHER_API_KEY == ''
        run: |
          echo "::error::Brak sekretu API_KEY_POGODA; testy API nie mogą zostać uruchomione."
          exit 1

      - name: Run common CI container
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          docker run -d \
            --name pogoda_api_environments_ci \
            -p 127.0.0.1:8000:8000 \
            -e OPENWEATHER_API_KEY \
            "${TEST_IMAGE}:${CI_TAG}"

      - name: Wait for common CI API
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            --output /dev/null \
            http://127.0.0.1:8000/openapi.json

      - name: Test common CI /weather endpoint
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          curl --fail --silent --show-error --max-time 30 --get \
            --data-urlencode "city=$WEATHER_CITY" \
            http://127.0.0.1:8000/weather

      - name: Show common CI container logs on failure
        if: failure()
        run: docker logs pogoda_api_environments_ci || true

      - name: Remove common CI container
        if: always()
        run: |
          docker stop pogoda_api_environments_ci || true
          docker rm pogoda_api_environments_ci || true

  build-and-push-dev:
    runs-on: ubuntu-latest
    needs: test
    environment: dev
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    concurrency:
      group: pogoda-env-publish-dev
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.configure_tag.outputs.image_tag }}
    steps:
      - name: Validate and export dev image tag
        id: configure_tag
        env:
          IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          EXPECTED_IMAGE_TAG: devpiotrkoska
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "::error::Environment variable IMAGE_TAG is required for dev."
            exit 1
          fi
          if [[ "$IMAGE_TAG" != "$EXPECTED_IMAGE_TAG" ]]; then
            echo "::error::Environment IMAGE_TAG must be $EXPECTED_IMAGE_TAG for dev."
            exit 1
          fi
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$GITHUB_ENV"
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push dev image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v7.4.0
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ steps.configure_tag.outputs.image_tag }}
            ${{ env.HUB_IMAGE_BASE }}:${{ steps.configure_tag.outputs.image_tag }}-${{ github.sha }}

  build-and-push-test:
    runs-on: ubuntu-latest
    needs: test
    environment: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    concurrency:
      group: pogoda-env-publish-test
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.configure_tag.outputs.image_tag }}
    steps:
      - name: Validate and export test image tag
        id: configure_tag
        env:
          IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          EXPECTED_IMAGE_TAG: testpiotrkoska
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "::error::Environment variable IMAGE_TAG is required for test."
            exit 1
          fi
          if [[ "$IMAGE_TAG" != "$EXPECTED_IMAGE_TAG" ]]; then
            echo "::error::Environment IMAGE_TAG must be $EXPECTED_IMAGE_TAG for test."
            exit 1
          fi
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$GITHUB_ENV"
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push test image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v7.4.0
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ steps.configure_tag.outputs.image_tag }}
            ${{ env.HUB_IMAGE_BASE }}:${{ steps.configure_tag.outputs.image_tag }}-${{ github.sha }}

  build-and-push-prod:
    runs-on: ubuntu-latest
    needs: test
    environment: prod
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    concurrency:
      group: pogoda-env-publish-prod
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.configure_tag.outputs.image_tag }}
    steps:
      - name: Validate and export prod image tag
        id: configure_tag
        env:
          IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          EXPECTED_IMAGE_TAG: prodpiotrkoska
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "::error::Environment variable IMAGE_TAG is required for prod."
            exit 1
          fi
          if [[ "$IMAGE_TAG" != "$EXPECTED_IMAGE_TAG" ]]; then
            echo "::error::Environment IMAGE_TAG must be $EXPECTED_IMAGE_TAG for prod."
            exit 1
          fi
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$GITHUB_ENV"
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push prod image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v7.4.0
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ steps.configure_tag.outputs.image_tag }}
            ${{ env.HUB_IMAGE_BASE }}:${{ steps.configure_tag.outputs.image_tag }}-${{ github.sha }}

  deploy-dev:
    runs-on: [self-hosted, linux]
    needs: build-and-push-dev
    environment: dev
    timeout-minutes: 5
    concurrency:
      group: pogoda-env-deploy-dev
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: dev
      IMAGE_DIGEST: ${{ needs.build-and-push-dev.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.build-and-push-dev.outputs.image_tag }}
      OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
    steps:
      - name: Validate dev deployment configuration
        env:
          APP_PORT: ${{ vars.APP_PORT }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          WEATHER_CITY: ${{ vars.WEATHER_CITY }}
          OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_PORT CONTAINER_NAME WEATHER_CITY IMAGE_DIGEST IMAGE_TAG OPENWEATHER_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required dev configuration is empty: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$APP_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::APP_PORT must be a port number from 1 to 65535."
            exit 1
          fi
          port_number=$((10#$APP_PORT))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "::error::APP_PORT must be a port number from 1 to 65535."
            exit 1
          fi
          if [[ ! "$CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "::error::CONTAINER_NAME may contain only letters, digits, '_' and '-', and must start with a letter or digit."
            exit 1
          fi
          if [[ "$WEATHER_CITY" == *$'\n'* || "$WEATHER_CITY" == *$'\r'* ]]; then
            echo "::error::WEATHER_CITY cannot contain line breaks."
            exit 1
          fi
          printf 'APP_PORT=%s\nCONTAINER_NAME=%s\nWEATHER_CITY=%s\nAPI_BASE_URL=http://127.0.0.1:%s\n' \
            "$APP_PORT" "$CONTAINER_NAME" "$WEATHER_CITY" "$APP_PORT" >> "$GITHUB_ENV"

      - name: Show dev deployment configuration
        run: |
          echo "Environment: $TARGET_ENVIRONMENT"
          echo "Image: $HUB_IMAGE_BASE"
          echo "Tag: $IMAGE_TAG"
          echo "Port: $APP_PORT"
          echo "Container: $CONTAINER_NAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull dev image by digest
        run: docker pull "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Remove previous dev container if it exists
        run: |
          existing_container="$(docker container ls --all --quiet \
            --filter "name=^/${CONTAINER_NAME}$")"
          if [[ -n "$existing_container" ]]; then
            docker rm --force "$existing_container"
          fi

      - name: Run dev container
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${APP_PORT}:8000" \
            -e OPENWEATHER_API_KEY \
            "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Verify dev API is ready
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            --output /dev/null \
            "$API_BASE_URL/openapi.json"
          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true

      - name: Test dev /weather endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 --get \
            --data-urlencode "city=$WEATHER_CITY" \
            "$API_BASE_URL/weather"

      - name: Show dev container logs on failure
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true

  deploy-test:
    runs-on: [self-hosted, linux]
    needs: build-and-push-test
    environment: test
    timeout-minutes: 5
    concurrency:
      group: pogoda-env-deploy-test
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: test
      IMAGE_DIGEST: ${{ needs.build-and-push-test.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.build-and-push-test.outputs.image_tag }}
      OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
    steps:
      - name: Validate test deployment configuration
        env:
          APP_PORT: ${{ vars.APP_PORT }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          WEATHER_CITY: ${{ vars.WEATHER_CITY }}
          OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_PORT CONTAINER_NAME WEATHER_CITY IMAGE_DIGEST IMAGE_TAG OPENWEATHER_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required test configuration is empty: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$APP_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::APP_PORT must be a port number from 1 to 65535."
            exit 1
          fi
          port_number=$((10#$APP_PORT))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "::error::APP_PORT must be a port number from 1 to 65535."
            exit 1
          fi
          if [[ ! "$CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "::error::CONTAINER_NAME may contain only letters, digits, '_' and '-', and must start with a letter or digit."
            exit 1
          fi
          if [[ "$WEATHER_CITY" == *$'\n'* || "$WEATHER_CITY" == *$'\r'* ]]; then
            echo "::error::WEATHER_CITY cannot contain line breaks."
            exit 1
          fi
          printf 'APP_PORT=%s\nCONTAINER_NAME=%s\nWEATHER_CITY=%s\nAPI_BASE_URL=http://127.0.0.1:%s\n' \
            "$APP_PORT" "$CONTAINER_NAME" "$WEATHER_CITY" "$APP_PORT" >> "$GITHUB_ENV"

      - name: Show test deployment configuration
        run: |
          echo "Environment: $TARGET_ENVIRONMENT"
          echo "Image: $HUB_IMAGE_BASE"
          echo "Tag: $IMAGE_TAG"
          echo "Port: $APP_PORT"
          echo "Container: $CONTAINER_NAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull test image by digest
        run: docker pull "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Remove previous test container if it exists
        run: |
          existing_container="$(docker container ls --all --quiet \
            --filter "name=^/${CONTAINER_NAME}$")"
          if [[ -n "$existing_container" ]]; then
            docker rm --force "$existing_container"
          fi

      - name: Run test container
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${APP_PORT}:8000" \
            -e OPENWEATHER_API_KEY \
            "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Verify test API is ready
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            --output /dev/null \
            "$API_BASE_URL/openapi.json"
          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true

      - name: Test test /weather endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 --get \
            --data-urlencode "city=$WEATHER_CITY" \
            "$API_BASE_URL/weather"

      - name: Show test container logs on failure
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true

  deploy-prod:
    runs-on: [self-hosted, linux]
    needs: build-and-push-prod
    environment: prod
    timeout-minutes: 5
    concurrency:
      group: pogoda-env-deploy-prod
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: prod
      IMAGE_DIGEST: ${{ needs.build-and-push-prod.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.build-and-push-prod.outputs.image_tag }}
      OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
    steps:
      - name: Validate prod deployment configuration
        env:
          APP_PORT: ${{ vars.APP_PORT }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          WEATHER_CITY: ${{ vars.WEATHER_CITY }}
          OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_PORT CONTAINER_NAME WEATHER_CITY IMAGE_DIGEST IMAGE_TAG OPENWEATHER_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required prod configuration is empty: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$APP_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::APP_PORT must be a port number from 1 to 65535."
            exit 1
          fi
          port_number=$((10#$APP_PORT))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "::error::APP_PORT must be a port number from 1 to 65535."
            exit 1
          fi
          if [[ ! "$CONTAINER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "::error::CONTAINER_NAME may contain only letters, digits, '_' and '-', and must start with a letter or digit."
            exit 1
          fi
          if [[ "$WEATHER_CITY" == *$'\n'* || "$WEATHER_CITY" == *$'\r'* ]]; then
            echo "::error::WEATHER_CITY cannot contain line breaks."
            exit 1
          fi
          printf 'APP_PORT=%s\nCONTAINER_NAME=%s\nWEATHER_CITY=%s\nAPI_BASE_URL=http://127.0.0.1:%s\n' \
            "$APP_PORT" "$CONTAINER_NAME" "$WEATHER_CITY" "$APP_PORT" >> "$GITHUB_ENV"

      - name: Show prod deployment configuration
        run: |
          echo "Environment: $TARGET_ENVIRONMENT"
          echo "Image: $HUB_IMAGE_BASE"
          echo "Tag: $IMAGE_TAG"
          echo "Port: $APP_PORT"
          echo "Container: $CONTAINER_NAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull prod image by digest
        run: docker pull "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Remove previous prod container if it exists
        run: |
          existing_container="$(docker container ls --all --quiet \
            --filter "name=^/${CONTAINER_NAME}$")"
          if [[ -n "$existing_container" ]]; then
            docker rm --force "$existing_container"
          fi

      - name: Run prod container
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${APP_PORT}:8000" \
            -e OPENWEATHER_API_KEY \
            "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Verify prod API is ready
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            --output /dev/null \
            "$API_BASE_URL/openapi.json"
          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true

      - name: Test prod /weather endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 --get \
            --data-urlencode "city=$WEATHER_CITY" \
            "$API_BASE_URL/weather"

      - name: Show prod container logs on failure
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true
