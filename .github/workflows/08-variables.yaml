name: 08 - Using variables

on: 
  workflow_dispatch:
    
env:
  WORKFLOW_VAR: 'I am a workflow env var'
  OVERWRITTEN: 'I will be overwritten'

jobs:
  echo:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: 'I am a job env var'
      OVERWRITTEN: 'I am the job env var that overwrites the workflow one'
    steps:
      - name: Print Env Variables
        env:
          STEP_VAR: 'I am a step env var'
          STEP_VAR2: 'I am another step env var'

        run: |
          echo "- i. \"Step env var: $STEP_VAR\""
          echo "- ii. \"Step env var 2: $STEP_VAR2\""
          echo "- iii. \"Job env var: $JOB_VAR\""
          echo "- iv. \"Workflow env var: $WORKFLOW_VAR\""
          echo "- v. \"Overwritten: $OVERWRITTEN\""
      - name: Overwrite Job Variable
        env:
          OVERWRITTEN: 'I have been overwritten at the step level'
        run: |
          echo "Step env var: $OVERWRITTEN"