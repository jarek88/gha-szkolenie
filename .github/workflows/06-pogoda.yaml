name: "06 – Pogoda"

on:
  workflow_dispatch:
    inputs:
      CITY:
        description: "City to get weather for"
        default: "Warsaw"
        required: true

env:
  API_KEY: ${{ secrets.POGODA_API_KEY }}
jobs:
  pogoda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: CWICZENIA/06-context/pogoda
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Display weather info
        run: bash start.sh ${{ github.event.inputs.CITY }} ${{ env.API_KEY }} >> $GITHUB_STEP_SUMMARY