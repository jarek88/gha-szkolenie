name: "04-03  Using Actions:Docker Nginx build external actions"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02
    env:
      IMAGE_NAME: webapp 
      TAG: ${{ github.sha }}
      HOST_PORT: 8080
      CONTAINER_PORT: 80

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4



      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build Docker Metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ env.TAG }}
      
      - name: Build docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Compose up
        uses: isbang/compose-action@v2
        with:
          compose-file: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02/docker-compose.yml
          down-flags: --volumes --remove-orphans

      - name: Health check
        id: health-check
        uses: jtalk/url-health-check-action@v3
        with:
          url: http://localhost:${{ env.HOST_PORT }}/
          max-attempts: 30
          retry-delay: 1s
          follow-redirect: false
      
      - name: GET
        id: get-request
        uses: Satak/webrequest-action@v1.2.4
        with:
          url: http://localhost:${{ env.HOST_PORT }}/
          method: GET
      - name: Assert Page
        id: assert-page
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request('GET', '${{ steps.get-request.outputs.url }}');
            if (response.status !== 200) {
              throw new Error("Page not accessible");
            }
      
