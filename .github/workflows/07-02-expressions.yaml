name: "07-02b Pogoda API CI"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - feature/07-pogoda-api
      - main
  pull_request:
    branches:
      - feature/07-pogoda-api
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKDIR: ./CWICZENIA/07-expressions/pogoda_python_flusk
  TEST_IMAGE: ${{ secrets.DOCKER_LOGIN }}/python_pogoda:test
  HUB_IMAGE_BASE: ${{ secrets.DOCKER_LOGIN }}/python_pogoda
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'prod07' || 'dev07' }}
  API_KEY: ${{ secrets.API_KEY_POGODA }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build local test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}
          load: true
          push: false

      - name: Save image to tar file
        run: docker save "$TEST_IMAGE" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pogoda-image
          path: image.tar

  test:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip tests]'))
    env:
      OPENWEATHER_API_KEY: ${{ secrets.API_KEY_POGODA }}
      API_KEY: ${{ secrets.API_KEY_POGODA }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pogoda-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Validate OpenWeather API key
        if: env.OPENWEATHER_API_KEY == ''
        run: |
          echo "Brak sekretu OPENWEATHER_API_KEY – testy API nie mogą zostać uruchomione."
          exit 1

      - name: Start API container
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          docker run -d \
            --name pogoda_api \
            -p 8000:8000 \
            -e "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" \
            "$TEST_IMAGE"

      - name: Wait for API startup
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          echo "Czekam na start API..."
          sleep 10

      - name: Test /weather endpoint
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          set -e
          echo "Testowanie endpointu /weather..."
          curl -f "http://localhost:8000/weather?city=Warsaw&api_key=$OPENWEATHER_API_KEY"
          echo
          echo "OK - endpoint /weather zwrócił odpowiedź 2xx."

      - name: Print container logs on failure
        if: failure()
        run: |
          echo "Logi kontenera:"
          docker logs pogoda_api || true

      - name: Stop and remove API container
        if: always()
        run: |
          docker stop pogoda_api || true
          docker rm pogoda_api || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:jaroslaw_kisiel-${{ github.sha }}
            ${{ env.HUB_IMAGE_BASE }}:jaroslaw_kisiel-${{ github.ref_name }}
            ${{ env.HUB_IMAGE_BASE }}:jaroslaw_kisiel-${{ env.DEPLOY_ENV }}
